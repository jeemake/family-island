<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏝️</text></svg>">
  <meta name="theme-color" content="#7cc7d2">
  <title>Family Island — Heart Hunt</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <div class="chip"><span class="label">Hearts</span><span id="score">0</span></div>
    <div class="chip center"><span class="label">Time</span><span id="timer">1:00</span></div>
    <div class="chip right"><span class="label">Lives</span><span id="lives"></span></div>
    <div id="combo"></div>
  </div>

  <div id="popups"></div>
  <div id="joystick" class="hidden"><div id="knob"></div></div>

  <div id="menu" class="overlay">
    <div class="card">
      <div class="kicker"><span class="bar"></span>A little island game</div>
      <h1>Family<br>Island</h1>
      <p id="lede" class="lede">Collect hearts for the family. Dodge the coconuts falling on the orange rings.</p>
      <div class="label">Choose your hero</div>
      <div class="heroes">
        <button class="hero" data-hero="JM"><img id="portrait-JM" alt=""><span>JM</span></button>
        <button class="hero" data-hero="M"><img id="portrait-M" alt=""><span>M</span></button>
      </div>
      <button id="play" class="primary" disabled>Loading…</button>
      <p class="controls"><b>WASD</b> / <b>arrows</b> to run · on a phone, drag anywhere</p>
      <p id="best-menu" class="best"></p>
    </div>
  </div>

  <div id="over" class="overlay hidden">
    <div class="card">
      <div class="kicker"><span class="bar"></span>Round over</div>
      <h1 id="over-title">Time's up!</h1>
      <p class="big"><span id="final">0</span><small>hearts</small></p>
      <p id="best-over" class="best"></p>
      <button id="again" class="primary">Play again</button>
      <button id="change" class="secondary">Change hero</button>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
